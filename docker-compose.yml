services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: datashield
      POSTGRES_USER: datashield
      POSTGRES_PASSWORD: ${DATASHIELD_DB_PASSWORD:?Set DATASHIELD_DB_PASSWORD in .env}
    volumes:
      - datashield_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashield"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://datashield:${DATASHIELD_DB_PASSWORD:?Set DATASHIELD_DB_PASSWORD in .env}@db:5432/datashield
      DATASHIELD_JWT_SECRET: ${DATASHIELD_JWT_SECRET:?Set DATASHIELD_JWT_SECRET in .env}
      DATASHIELD_AGENT_KEY: ${DATASHIELD_AGENT_KEY:?Set DATASHIELD_AGENT_KEY in .env}
      DATASHIELD_FRONTEND_ORIGIN: http://localhost:3001
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"
volumes:
  datashield_pg:
